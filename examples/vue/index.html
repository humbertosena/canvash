<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvash — Vue</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f2f3f5;
        color: #1f1f1f;
      }
      /* Conteúdo do cartão do playground: o playground, a persistência e a colaboração. */
      .menu-content {
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 13px;
      }
      .menu-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .menu-title {
        font-weight: 600;
        font-size: 0.8125rem;
        color: #3f434a;
      }
      .menu-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      /* As camadas ocupam o cartão da esquerda, que começa escondido. */
      .left-stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
        height: 100%;
      }
      .left-stack[hidden] {
        display: none;
      }
      .left-stack > * {
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        overflow: auto;
      }
      /* Botão do playground: no fim da toolbar vertical, abaixo do divisor. */
      .playground-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 0;
        color: #1f1f1f;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
      }
      .playground-button:hover,
      .playground-button:active {
        background: rgba(0, 0, 0, 0.06);
      }
      .playground-button:focus-visible {
        outline: 2px solid #1f1f1f;
        outline-offset: 1px;
      }
      .playground-button[aria-expanded='true'],
      .playground-button[aria-expanded='true']:hover {
        color: #ffffff;
        background: #1f1f1f;
        border-color: #1f1f1f;
      }
      /* Cartão do playground: um popover à esquerda da toolbar, centralizado na vertical. O `right`
         e o max-width são reservas: ao abrir, o exemplo os recalcula pela largura real da toolbar. */
      .playground-panel {
        position: fixed;
        inset: auto;
        top: 50%;
        right: calc(var(--canvash-island-margin, 16px) + 70px + 12px);
        box-sizing: border-box;
        width: 360px;
        max-width: min(360px, calc(100vw - 2 * var(--canvash-island-margin, 16px) - 70px - 12px));
        max-height: calc(100vh - 2 * var(--canvash-island-margin, 16px));
        margin: 0;
        padding: 12px;
        overflow: auto;
        color: #1f1f1f;
        background: var(--canvash-surface-float, #ebecef);
        border: 1px solid var(--canvash-surface-float-border, rgba(0, 0, 0, 0.06));
        border-radius: var(--canvash-radius-card, 16px);
        box-shadow:
          0 4px 16px rgba(0, 0, 0, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.04);
        transform: translateY(-50%);
      }
      /* O display do .menu-content venceria o display: none do navegador para o popover fechado. */
      .playground-panel:not(:popover-open) {
        display: none;
      }
      /* Aviso passageiro logo abaixo do topo (menu, compartilhar e avatar). */
      #app-status {
        position: fixed;
        top: calc(var(--canvash-island-margin, 16px) + 32px + 12px);
        left: 50%;
        z-index: 50;
        max-width: calc(100vw - 32px);
        padding: 6px 14px;
        font-size: 13px;
        color: #1f1f1f;
        background: var(--canvash-surface-float, #ebecef);
        border: 1px solid var(--canvash-surface-float-border, rgba(0, 0, 0, 0.06));
        border-radius: 9999px;
        box-shadow:
          0 4px 16px rgba(0, 0, 0, 0.08),
          0 1px 2px rgba(0, 0, 0, 0.04);
        transform: translateX(-50%);
        pointer-events: none;
      }
      #app-status:empty,
      #app-status[hidden] {
        display: none;
      }

      .btn-group {
        display: inline-flex;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid #cbd5e1;
      }
      button {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        padding: 6px 12px;
        font-size: 0.875rem;
        cursor: pointer;
        border-radius: 4px;
        transition: background 0.15s;
      }
      .btn-group button {
        border: none;
        border-right: 1px solid #cbd5e1;
        border-radius: 0;
      }
      .btn-group button:last-child {
        border-right: none;
      }
      button:hover {
        background: #f1f5f9;
      }
      button:active {
        background: #e2e8f0;
      }
      .extra-panel {
        padding: 12px 16px;
        background: #ffffff;
        border-top: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-sizing: border-box;
        flex-shrink: 0;
      }
      .extra-panel-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .extra-panel-label {
        font-weight: 600;
        font-size: 0.875rem;
        color: #3f434a;
        min-width: 0;
      }
      .status-pill {
        font-family: monospace;
        font-size: 0.8125rem;
        padding: 4px 8px;
        background: #f1f5f9;
        border-radius: 4px;
        color: #475569;
        border: 1px solid #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
